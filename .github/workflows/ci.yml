name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it builds.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The runner image ships the Android SDK with the platform and build-tools this project uses.
      - name: Run tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
